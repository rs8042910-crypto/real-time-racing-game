<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real-Time Racing Game</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
      .wrap { max-width: 1080px; margin: 24px auto; padding: 0 16px; }
      canvas { background: #111827; border: 2px solid #334155; width: 100%; height: auto; }
      .hud { display: flex; justify-content: space-between; margin: 8px 0 16px; font-size: 14px; gap: 12px; flex-wrap: wrap; }
      .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
      .card { border: 1px solid #334155; border-radius: 8px; padding: 12px; background: #111827; }
      button { background:#1d4ed8; color:#fff; border:none; border-radius:6px; padding:6px 10px; margin:2px; cursor:pointer; }
      button:hover { background:#2563eb; }
      small { color:#94a3b8; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Multiplayer Car Game</h1>
      <div class="hud">
        <div>Controls: Arrow keys / WASD</div>
        <div id="status">Connecting...</div>
        <div id="wallet">Wallet: -</div>
      </div>
      <div class="grid">
        <div class="card">
          <canvas id="track" width="900" height="500"></canvas>
        </div>
        <div class="card">
          <h3>Garage / Shop</h3>
          <div>
            <button id="joinRoom">Join Room 1</button>
            <button id="startCountdown">Start Countdown</button>
          </div>
          <p id="roomState"><small>Room: none</small></p>
          <hr/>
          <div>
            <button id="buySprint">Buy Sprint GT (soft)</button>
            <button id="buyNitro">Buy Nitro X (premium)</button>
          </div>
          <div>
            <button id="buyUpgrade">Buy Engine Upgrade</button>
            <button id="selectSprint">Select Sprint GT</button>
          </div>
          <div>
            <button id="rewardWin">Claim Win Reward</button>
            <button id="buyPremium">Buy Premium Pack</button>
          </div>
          <pre id="log" style="white-space:pre-wrap; font-size:12px;"></pre>
        </div>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const profileId = localStorage.getItem('profileId') || `user-${Math.random().toString(36).slice(2, 8)}`;
      localStorage.setItem('profileId', profileId);

      const socket = io({ query: { profileId } });
      const canvas = document.getElementById('track');
      const ctx = canvas.getContext('2d');
      const statusEl = document.getElementById('status');
      const walletEl = document.getElementById('wallet');
      const roomStateEl = document.getElementById('roomState');
      const logEl = document.getElementById('log');

      const keys = { up: false, down: false, left: false, right: false };
      let me = null;
      let state = { players: [] };

      function log(msg, data) {
        logEl.textContent = `${msg}${data ? '\n' + JSON.stringify(data, null, 2) : ''}\n\n` + logEl.textContent;
      }

      async function api(path, method = 'GET', body) {
        const res = await fetch(path, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: body ? JSON.stringify(body) : undefined
        });
        return res.json();
      }

      async function refreshWallet() {
        const profile = await api(`/api/garage/${profileId}`);
        walletEl.textContent = `Wallet: soft ${profile.balances.softCurrency} | premium ${profile.balances.premiumCurrency}`;
      }

      socket.on('connect', () => {
        statusEl.textContent = `Connected: ${socket.id} (${profileId})`;
      });
      socket.on('bootstrap', async (payload) => {
        me = payload.me;
        await refreshWallet();
      });
      socket.on('state', (nextState) => { state = nextState; render(); });
      socket.on('room:state', (room) => {
        roomStateEl.innerHTML = `<small>Room: ${room.roomId} | players: ${room.players.length} | started: ${room.raceStarted}</small>`;
      });
      socket.on('disconnect', () => { statusEl.textContent = 'Disconnected'; });

      function setKey(code, pressed) {
        if (code === 'ArrowUp' || code === 'KeyW') keys.up = pressed;
        if (code === 'ArrowDown' || code === 'KeyS') keys.down = pressed;
        if (code === 'ArrowLeft' || code === 'KeyA') keys.left = pressed;
        if (code === 'ArrowRight' || code === 'KeyD') keys.right = pressed;
        socket.emit('player:input', keys);
      }

      addEventListener('keydown', (e) => setKey(e.code, true));
      addEventListener('keyup', (e) => setKey(e.code, false));

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#1f2937';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        for (const p of state.players) {
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x - 10, p.y - 6, 20, 12);
          if (me && p.id === me.id) {
            ctx.strokeStyle = '#f8fafc';
            ctx.lineWidth = 2;
            ctx.strokeRect(p.x - 12, p.y - 8, 24, 16);
          }
        }
      }

      document.getElementById('joinRoom').onclick = () => socket.emit('matchmaking:join', { roomId: 'room-1' });
      document.getElementById('startCountdown').onclick = () => socket.emit('matchmaking:startCountdown', { roomId: 'room-1', seconds: 5 });

      document.getElementById('buySprint').onclick = async () => { log('buy sprint', await api('/api/shop/buy/car', 'POST', { profileId, carId: 'car_sprint', currency: 'soft' })); refreshWallet(); };
      document.getElementById('buyNitro').onclick = async () => { log('buy nitro', await api('/api/shop/buy/car', 'POST', { profileId, carId: 'car_nitro', currency: 'premium' })); refreshWallet(); };
      document.getElementById('buyUpgrade').onclick = async () => { log('buy upgrade', await api('/api/shop/buy/upgrade', 'POST', { profileId, carId: 'car_sprint', upgradeId: 'upg_engine_1', currency: 'soft' })); refreshWallet(); };
      document.getElementById('selectSprint').onclick = async () => { log('select sprint', await api('/api/garage/select-car', 'POST', { profileId, carId: 'car_sprint' })); };
      document.getElementById('rewardWin').onclick = async () => { log('reward', await api('/api/race/reward', 'POST', { profileId, placement: 1 })); refreshWallet(); };
      document.getElementById('buyPremium').onclick = async () => { log('premium pack', await api('/api/wallet/premium/purchase', 'POST', { profileId, packageId: 'starter_pack' })); refreshWallet(); };
    </script>
  </body>
</html>
